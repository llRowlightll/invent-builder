name: Nightly Self-Eval (report-only)

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC varje natt (04:00 svensk tid)
  workflow_dispatch:        # Kan också triggas manuellt

# Least-privilege token. issues:write lets the alert step file an issue WITHOUT
# the 403 that was turning every run red (and emailing you) when one was due.
permissions:
  contents: read
  issues: write

jobs:
  eval-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Run 30 random scenarios (eval, report-only — never writes the catalog)
        id: eval
        run: |
          python3 scripts/eval-auto.py --runs 30 --seed $(date +%Y%m%d) \
            2>&1 | tee eval-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        continue-on-error: true   # Fånga output även vid fel

      # Property-based eval: randomized scenarios (incl. no-stroke + precision)
      # checking INVARIANTS that must hold for every response. Report-only.
      - name: Run property-based invariant eval
        id: invariants
        run: |
          python3 scripts/eval-invariants.py --runs 20 --seed $(date +%Y%m%d) \
            2>&1 | tee invariants-output.txt
          INV_FAILS=$(grep -oE '[0-9]+ ❌' invariants-output.txt | grep -oE '[0-9]+' | tail -1 || echo 0)
          echo "fails=${INV_FAILS:-0}" >> "$GITHUB_OUTPUT"
          {
            echo "## 🔬 Invariant Eval — $(date '+%Y-%m-%d')"
            echo '```'
            tail -50 invariants-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Parse results
        id: results
        run: |
          PASSES=$(grep -o '[0-9]* ✅' eval-output.txt | grep -o '[0-9]*' | tail -1 || echo 0)
          FAILS=$(grep -o '[0-9]* ❌' eval-output.txt | grep -o '[0-9]*' | tail -1 || echo 0)
          SKIPS=$(grep -o '[0-9]* ⚠️' eval-output.txt | grep -o '[0-9]*' | tail -1 || echo 0)
          GAPS=$(grep -c 'KATALOGLUCKA' eval-output.txt || true)
          echo "passes=$PASSES" >> $GITHUB_OUTPUT
          echo "fails=$FAILS"   >> $GITHUB_OUTPUT
          echo "skips=$SKIPS"   >> $GITHUB_OUTPUT
          echo "gaps=$GAPS"     >> $GITHUB_OUTPUT

      - name: Write job summary
        run: |
          echo "## 🤖 Nightly Eval — $(date '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resultat | Antal |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Gröna | ${{ steps.results.outputs.passes }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Fel   | ${{ steps.results.outputs.fails }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚠️ Skip  | ${{ steps.results.outputs.skips }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.results.outputs.gaps }}" != "0" && -n "${{ steps.results.outputs.gaps }}" ]]; then
            echo "**Katalogluckor (rapport — EJ auto-skapade):** ${{ steps.results.outputs.gaps }} st — se loggen för stroke/bore. Överväg att ta in en riktig produkt." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Fullständig output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat eval-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Open GitHub Issue on repeated failures
        # Alert only on SYSTEMIC regressions (≥3), never single-scenario LLM noise.
        # continue-on-error so a failed alert can never turn the nightly red.
        if: fromJSON(steps.results.outputs.fails || '0') >= 3
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fails = '${{ steps.results.outputs.fails }}';
            const date  = new Date().toISOString().split('T')[0];
            const fs    = require('fs');
            const output = fs.readFileSync('eval-output.txt', 'utf8');

            // Check if there's already an open eval issue today
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              labels: 'eval-failure',
              state:  'open',
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                title: `🚨 Nightly eval: ${fails} fel hittade (${date})`,
                body:  `## Eval misslyckades\n\n${fails} scenarios returnerade fysikaliskt felaktiga produktval.\n\n\`\`\`\n${output.slice(0, 3000)}\n\`\`\`\n\nKör lokalt för att reproducera:\n\`\`\`bash\npython3 scripts/eval-auto.py --seed $(date +%Y%m%d) --runs 30 --verbose\n\`\`\``,
                labels: ['eval-failure', 'bug'],
              });
            }

      - name: Open GitHub Issue on invariant failures
        # Alert only on SYSTEMIC regressions (≥3), never single-scenario LLM noise.
        # continue-on-error so a failed alert can never turn the nightly red.
        if: fromJSON(steps.invariants.outputs.fails || '0') >= 3
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fails  = '${{ steps.invariants.outputs.fails }}';
            const date   = new Date().toISOString().split('T')[0];
            const fs     = require('fs');
            const output = fs.existsSync('invariants-output.txt') ? fs.readFileSync('invariants-output.txt', 'utf8') : '';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'invariant-failure', state: 'open',
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `🔬 Invariant eval: ${fails} invariantbrott (${date})`,
                body:  `## Invariantbrott\n\n${fails} scenario(n) bröt en invariant (precision / ATEX / stroke / bore / no-hallucination).\n\n\`\`\`\n${output.slice(0, 3000)}\n\`\`\`\n\nReproducera:\n\`\`\`bash\npython3 scripts/eval-invariants.py --seed $(date +%Y%m%d) --runs 20\n\`\`\``,
                labels: ['invariant-failure', 'bug'],
              });
            }
