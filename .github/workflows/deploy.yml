name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize the LLM-heavy advisor CI (this workflow + edge-deploy.yml) so they
# don't hammer Groq concurrently on the same push — caused rate-limit flakes.
concurrency:
  group: advisor-llm-ci
  cancel-in-progress: false

jobs:
  # ── 0. Rör pushen AI-koden? ────────────────────────────────────────────────
  # Sviten och evalen nedan anropar Groq med SAMMA konto som sajten. 2026-10-06
  # körde de på varje push -- tio ihopslagningar på en dag tömde dygnskvoten
  # (retry-after 4258 s), och sajtens AI-chatt var nere för besökare i 1,5 h.
  # Båda anropar bara den driftsatta motorn (supabase/functions) och testar
  # aldrig frontendkoden. De behövs alltså bara när motorn eller skripten
  # ändras. Manuell körning testar alltid.
  andringar:
    runs-on: ubuntu-latest
    outputs:
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          FORE: ${{ github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" != "push" || -z "$FORE" || "$FORE" =~ ^0+$ ]] || ! git cat-file -e "$FORE^{commit}" 2>/dev/null; then
            echo "ai=true" >> "$GITHUB_OUTPUT"; echo "ingen jämförelsepunkt -- AI-testerna körs"; exit 0
          fi
          AI_KOD='^(supabase/functions/|scripts/(test-advisor\.sh|eval-auto\.py)$|\.github/workflows/deploy\.yml$)'
          traffar=$(git diff --name-only "$FORE" "$GITHUB_SHA" | grep -E "$AI_KOD" || true)
          if [[ -n "$traffar" ]]; then
            echo "ai=true" >> "$GITHUB_OUTPUT"; echo "motorn eller testerna ändrades:"; echo "$traffar"
          else
            echo "ai=false" >> "$GITHUB_OUTPUT"; echo "motorn ändrades inte -- sviten och evalen hoppas över"
          fi

  # ── 1. BOM regression suite (29 tests) ─────────────────────────────────────
  regression:
    needs: andringar
    if: needs.andringar.outputs.ai == 'true'
    runs-on: ubuntu-latest
    # Edge-deployen (deno-test, deploy, svit) tar runt tio minuter.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Engine tests -- edge-deploy's suite, or our own run
        # edge-deploy.yml kör SAMMA svit (scripts/test-advisor.sh) direkt efter
        # att den lagt ut funktionen. Att köra den här igen dubblade Groq-
        # anropen för varje motorändring. Finns ett edge-deploy för den här
        # SHA:n väntar vi in det och ärver dess resultat; annars (bara evalen
        # eller det här flödet ändrades, eller manuell körning) körs sviten här.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=""
          for i in 1 2 3; do
            run_id=$(gh run list --workflow edge-deploy.yml --commit "$GITHUB_SHA" --json databaseId --jq '.[0].databaseId // empty')
            [[ -n "$run_id" ]] && break
            sleep 10   # flödet registreras några sekunder efter pushen
          done
          if [[ -n "$run_id" ]]; then
            echo "edge-deploy $run_id kör sviten -- väntar in resultatet"
            gh run watch "$run_id" --exit-status --interval 20 > /dev/null
            echo "edge-deploy $run_id: grönt"
          else
            echo "inget edge-deploy för $GITHUB_SHA -- sviten körs här"
            chmod +x scripts/test-advisor.sh
            ./scripts/test-advisor.sh
          fi

  # ── 2. Options accuracy eval (10 random physical scenarios) ─────────────────
  eval-accuracy:
    needs: [andringar, regression]   # serialize the two LLM-heavy jobs (avoid concurrent Groq load)
    if: needs.andringar.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run options accuracy eval (10 scenarios)
        run: python3 scripts/eval-auto.py --runs 10 --seed ${{ github.run_number }}
        # seed = CI run number → different scenarios every run, but reproducible per run

  # ── 3. Build & deploy frontend only when both test jobs are green ────────────
  # Överhoppade tester (ingen AI-kod ändrad) stoppar inte driftsättningen;
  # ett fallerat eller avbrutet test gör det fortfarande.
  deploy:
    needs: [andringar, regression, eval-accuracy]
    if: >-
      always() && needs.andringar.result == 'success' &&
      (needs.regression.result == 'success' || needs.regression.result == 'skipped') &&
      (needs['eval-accuracy'].result == 'success' || needs['eval-accuracy'].result == 'skipped')
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catch type errors the bundler (esbuild) silently ignores — e.g. an
      # out-of-scope variable that becomes a runtime ReferenceError.
      - name: Type-check (tsc)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json
