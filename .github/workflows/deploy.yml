name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. BOM regression suite (29 tests) ─────────────────────────────────────
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run BOM regression suite (29 tests)
        run: |
          chmod +x scripts/test-advisor.sh
          ./scripts/test-advisor.sh

  # ── 2. Options accuracy eval (10 random physical scenarios) ─────────────────
  eval-accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run options accuracy eval (10 scenarios)
        run: python3 scripts/eval-auto.py --runs 10 --seed ${{ github.run_number }}
        # seed = CI run number → different scenarios every run, but reproducible per run

  # ── 3. Build & deploy frontend only when both test jobs are green ────────────
  deploy:
    needs: [regression, eval-accuracy]
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json
