name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize the LLM-heavy advisor CI (this workflow + edge-deploy.yml) so they
# don't hammer Groq concurrently on the same push — caused rate-limit flakes.
concurrency:
  group: advisor-llm-ci
  cancel-in-progress: false

jobs:
  # ── 1. BOM regression suite (29 tests) ─────────────────────────────────────
  regression:
    runs-on: ubuntu-latest
    # 12 räckte för sviten ensam; väntan på edge-deploy nedan kan ta upp till
    # sex minuter till (deno-testerna körs före deployen där).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Wait for this commit's edge function to be deployed
        # Båda flödena startar på samma push. När pushen ändrar funktionen OCH
        # sviten körde den här sviten mot den GAMLA funktionen: 2026-09-22 föll
        # T42/T43 rött här klockan 07:20, en minut innan edge-deploy.yml hade
        # lagt ut funktionen de var skrivna för. Vänta tills edge-deploys
        # deploysteg för samma SHA är klart, om det finns ett sådant flöde.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            run_id=$(gh run list --workflow edge-deploy.yml --commit "$GITHUB_SHA" --json databaseId --jq '.[0].databaseId // empty')
            if [[ -z "$run_id" ]]; then
              # Flödet registreras några sekunder efter pushen; ge det tre chanser.
              if [[ $i -ge 3 ]]; then echo "inget edge-deploy för $GITHUB_SHA -- funktionen ändrades inte"; break; fi
              sleep 10; continue
            fi
            st=$(gh run view "$run_id" --json jobs --jq '[.jobs[].steps[] | select(.name == "Deploy groq-advisor to Supabase")][0] | (.conclusion // .status // "pending")')
            case "$st" in
              success) echo "edge-deploy $run_id: funktionen är utlagd"; break;;
              failure|cancelled|skipped) echo "edge-deploy $run_id: deploysteget gav $st -- sviten körs mot funktionen som ligger ute"; break;;
              *) echo "väntar på edge-deploy $run_id ($st)…"; sleep 20;;
            esac
          done

      - name: Run BOM regression suite (29 tests)
        run: |
          chmod +x scripts/test-advisor.sh
          ./scripts/test-advisor.sh

  # ── 2. Options accuracy eval (10 random physical scenarios) ─────────────────
  eval-accuracy:
    needs: regression   # serialize the two LLM-heavy jobs (avoid concurrent Groq load)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run options accuracy eval (10 scenarios)
        run: python3 scripts/eval-auto.py --runs 10 --seed ${{ github.run_number }}
        # seed = CI run number → different scenarios every run, but reproducible per run

  # ── 3. Build & deploy frontend only when both test jobs are green ────────────
  deploy:
    needs: [regression, eval-accuracy]
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catch type errors the bundler (esbuild) silently ignores — e.g. an
      # out-of-scope variable that becomes a runtime ReferenceError.
      - name: Type-check (tsc)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json
