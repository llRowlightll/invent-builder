name: Deploy & Regression-test Edge Function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'scripts/test-advisor.sh'
  workflow_dispatch:

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy groq-advisor to Supabase
        run: npx --yes supabase@latest functions deploy groq-advisor --project-ref buqfbcztspswezwyafxo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Give the new deployment a moment to warm up before hammering it with 21 tests
      - name: Wait for cold start
        run: sleep 8

      - name: Run regression suite (21 tests)
        run: |
          chmod +x scripts/test-advisor.sh
          ./scripts/test-advisor.sh
        # ADVISOR_URL and ADVISOR_KEY fall back to hardcoded defaults in the script
        # Override here if you want to target a different environment:
        # env:
        #   ADVISOR_URL: ${{ secrets.ADVISOR_URL }}
        #   ADVISOR_KEY: ${{ secrets.ADVISOR_KEY }}
