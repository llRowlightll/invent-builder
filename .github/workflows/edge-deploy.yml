name: Deploy & Regression-test Edge Function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'scripts/test-advisor.sh'
  workflow_dispatch:

# Edge deploy gets its OWN concurrency group (NOT shared with deploy.yml). When it
# was shared, a frontend deploy or a second edge merge queuing in the group could
# get the pending edge run cancelled — silently skipping the function deploy while
# CI looked green (PR #68 incident). The tests have retry/backoff, so the rare
# overlap with deploy.yml's Groq load is tolerable.
concurrency:
  group: edge-deploy
  cancel-in-progress: false

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Deploy groq-advisor to Supabase
        # continue-on-error: deploy is best-effort — tests still run against live endpoint
        # even if SUPABASE_ACCESS_TOKEN is missing or invalid.
        continue-on-error: true
        id: deploy
        run: npx --yes supabase@latest functions deploy groq-advisor --project-ref buqfbcztspswezwyafxo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Fail if deploy did not succeed
        # A failed/skipped deploy must turn the run RED. Otherwise the live function
        # silently stays on the old code while CI looks green (PR #68 incident).
        if: steps.deploy.outcome != 'success'
        run: |
          echo "::error::Edge function deploy did not succeed (outcome=${{ steps.deploy.outcome }})."
          echo "::error::The live function was NOT updated — failing the run so it can't slip through."
          exit 1

      - name: Wait for cold start
        run: sleep 8

      # Post-deploy verification: the 29-scenario suite runs against the LIVE
      # endpoint, so a green run here proves the just-deployed function works.
      - name: Run regression suite (29 tests)
        run: |
          chmod +x scripts/test-advisor.sh
          ./scripts/test-advisor.sh
