name: Deploy & Regression-test Edge Function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'scripts/test-advisor.sh'
  workflow_dispatch:

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy groq-advisor to Supabase
        # continue-on-error: deploy is best-effort — tests still run against live endpoint
        # even if SUPABASE_ACCESS_TOKEN is missing or invalid.
        continue-on-error: true
        id: deploy
        run: npx --yes supabase@latest functions deploy groq-advisor --project-ref buqfbcztspswezwyafxo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Warn if deploy skipped
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "::warning::Edge function deploy failed (invalid or missing SUPABASE_ACCESS_TOKEN)."
          echo "::warning::Regression tests will run against the currently deployed version."

      - name: Wait for cold start
        run: sleep 8

      - name: Run regression suite (29 tests)
        run: |
          chmod +x scripts/test-advisor.sh
          ./scripts/test-advisor.sh
