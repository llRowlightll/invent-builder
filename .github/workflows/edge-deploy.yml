name: Deploy & Regression-test Edge Function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'scripts/test-advisor.sh'
  workflow_dispatch:

# Edge deploy gets its OWN concurrency group (NOT shared with deploy.yml). When it
# was shared, a frontend deploy or a second edge merge queuing in the group could
# get the pending edge run cancelled — silently skipping the function deploy while
# CI looked green (PR #68 incident). The tests have retry/backoff, so the rare
# overlap with deploy.yml's Groq load is tolerable.
concurrency:
  group: edge-deploy
  cancel-in-progress: false

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check + unit-test pure logic (deno)
        # Fails fast on broken deterministic BOM/hazard-detection logic BEFORE
        # deploying or spending live Groq quota on the regression suite below.
        # deno check runs on index.ts explicitly: deno test alone only
        # type-checks what *.test.ts files import, and no test file may import
        # index.ts (it unconditionally calls Deno.serve() at module scope).
        #
        # --node-modules-dir=none: this repo's root package.json makes Deno
        # auto-detect "managed node_modules" mode for npm: specifiers (e.g.
        # @supabase/functions-js's own npm:openai dependency) -- which then
        # requires a populated node_modules/ to resolve them. This step runs
        # before "Setup Node"/npm install, so on a fresh checkout node_modules
        # doesn't exist yet and resolution fails (confirmed: reproduced locally
        # with an empty DENO_DIR + a real node_modules present -- passed;
        # failed the same way as CI once node_modules was taken out of the
        # picture). This flag forces Deno back to its own global npm-cache
        # resolution instead, which needs no local node_modules at all.
        run: |
          # Typkontrollera ALLA funktioner, inte ett urval. supplier-po skickar
          # inköpsordrar till leverantörer och får inte driftsättas trasig -- ett
          # fel där betyder att ingen beställning går ut -- men samma sak gäller
          # var och en av de andra, och ett urval blir bara inaktuellt.
          for f in supabase/functions/*/index.ts; do
            echo "check $f"
            deno check --no-lock --node-modules-dir=none "$f"
          done
          # --allow-read krävs av synktestet, som läser src/lib/physics.ts och
          # gör bygget rött om husets kraftmodell glidit isär mellan
          # Deno-runtimen och Vite-runtimen. Utan behörigheten hoppar testet
          # tyst över sig självt och kontrollerar ingenting.
          deno test --allow-read --no-lock --node-modules-dir=none supabase/functions/groq-advisor/

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Alla funktioner driftsätts i EN loop, av ett skäl som kostat oss redan:
      # nio av fjorton låg utanför CI och hade driftsatts för hand. En av dem,
      # rfq-status-request, stod kvar på version 1 med entrypoint under /tmp --
      # en rättning i repot nådde alltså aldrig produktion, och ingen märkte
      # det förrän någon läste den driftsatta koden. Med en lista i stället för
      # ett stegpar per funktion kostar det EN rad att lägga till nästa, så
      # ingen frestas att hoppa över det.
      #
      # Loopen sväljer inte fel: varje misslyckad deploy samlas och steget dör
      # röd på slutet. En tyst hoppad deploy lämnar gammal kod live medan CI
      # ser grön ut (PR #68), och det är hela poängen med kontrollen.
      - name: Deploy all edge functions to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -u
          FUNCTIONS="
            groq-advisor
            rfq-notify
            order-status-email
            rfq-status-request
            supplier-po
            ai-search
            welcome-email
            hubspot-sync
            fortnox-order
            book-shipment
            document-ai
            extract-prices
            extract-products
            generate-product-images
          "
          MISSLYCKADE=""
          for fn in $FUNCTIONS; do
            echo "::group::deploy $fn"
            if npx --yes supabase@latest functions deploy "$fn" --project-ref buqfbcztspswezwyafxo; then
              echo "✓ $fn"
            else
              echo "::error::$fn deploy misslyckades — den live-funktionen står kvar på gammal kod."
              MISSLYCKADE="$MISSLYCKADE $fn"
            fi
            echo "::endgroup::"
          done
          if [ -n "$MISSLYCKADE" ]; then
            echo "::error::Dessa funktioner driftsattes INTE:$MISSLYCKADE"
            exit 1
          fi
          echo "Alla $(echo $FUNCTIONS | wc -w) funktioner driftsatta."

      - name: Wait for cold start
        run: sleep 8

      # Post-deploy verification: the 29-scenario suite runs against the LIVE
      # endpoint, so a green run here proves the just-deployed function works.
      - name: Run regression suite (29 tests)
        run: |
          chmod +x scripts/test-advisor.sh
          ./scripts/test-advisor.sh
