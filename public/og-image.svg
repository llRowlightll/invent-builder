<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1F3864"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Orange accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#E8752A"/>

  <!-- Logo mark -->
  <rect x="80" y="60" width="80" height="80" rx="14" fill="#E8752A"/>
  <text x="120" y="122" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="white" text-anchor="middle">M</text>

  <!-- Main headline -->
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="white">Maskinval</text>
  <text x="80" y="320" font-family="Arial, sans-serif" font-size="38" font-weight="400" fill="#CBD5E1">Industriell automation &amp; pneumatik</text>

  <!-- Divider -->
  <rect x="80" y="360" width="120" height="4" rx="2" fill="#E8752A"/>

  <!-- Subtext -->
  <text x="80" y="420" font-family="Arial, sans-serif" font-size="28" fill="#94A3B8">Festo · SMC · Parker · Bosch Rexroth · Norgren · Metal Work</text>
  <text x="80" y="468" font-family="Arial, sans-serif" font-size="26" fill="#64748B">AI-sökning · Spec-jämförelse · Stycklista &amp; offert på sekunder</text>

  <!-- Domain -->
  <text x="1120" y="590" font-family="Arial, sans-serif" font-size="24" fill="#475569" text-anchor="end">maskinval.se</text>
</svg>
