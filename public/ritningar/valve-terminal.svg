    <rect x="204" y="114" width="54" height="66" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <rect x="272" y="114" width="54" height="66" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
