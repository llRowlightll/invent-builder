    <rect x="226" y="192" width="10" height="16" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
    <rect x="336" y="192" width="10" height="16" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
